<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./favicon.ico" />

    <!-- Inter / JetBrains Mono back up the system SF fonts on non-Apple devices. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- SEO -->
    <title>DataCia — Free, open-source SQL client for macOS and Windows</title>
    <meta
      name="description"
      content="A fast, local-first SQL client for PostgreSQL, MySQL, SQLite and ClickHouse. AI-assisted, inline suggestions, script mode and export to JSON, CSV or PNG. Free and open source."
    />
    <meta
      name="keywords"
      content="open source database client, free SQL client, SQL editor, PostgreSQL client, MySQL client, SQLite browser, ClickHouse client, local-first, AI SQL assistant"
    />
    <meta name="author" content="DataCia" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.datacia.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.datacia.app" />
    <meta property="og:site_name" content="DataCia" />
    <meta property="og:title" content="DataCia — Free, open-source SQL client" />
    <meta
      property="og:description"
      content="A fast, local-first SQL client for PostgreSQL, MySQL, SQLite and ClickHouse. Now free and open source."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://www.datacia.app/preview.png" />
    <meta property="og:image:width" content="900" />
    <meta property="og:image:height" content="420" />
    <meta property="og:image:alt" content="DataCia — free, open-source database client" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DataCia — Free, open-source SQL client" />
    <meta
      name="twitter:description"
      content="Local-first, AI-assisted SQL client for PostgreSQL, MySQL, SQLite and ClickHouse. Free and open source."
    />
    <meta name="twitter:image" content="https://www.datacia.app/preview.png" />

    <script type="module" src="./frontend.tsx" async></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
